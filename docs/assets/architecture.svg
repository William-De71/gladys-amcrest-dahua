<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340">
  <!-- Illustration: architecture of the Amcrest / Dahua integration for Gladys. -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
  <rect width="960" height="340" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="90" width="220" height="160" rx="14" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
    <text x="130" y="128" font-size="20" font-weight="bold" fill="#1f2328">Gladys Assistant</text>
    <text x="130" y="156" font-size="14" fill="#57606a">camera devices, live view</text>
    <text x="130" y="176" font-size="14" fill="#57606a">scenes, widgets</text>
    <text x="130" y="196" font-size="14" fill="#57606a">DHIP broadcast relay</text>
    <text x="130" y="216" font-size="14" fill="#57606a">(host network)</text>
    <rect x="360" y="90" width="240" height="160" rx="14" fill="#eef8f0" stroke="#1a7f37" stroke-width="2"/>
    <text x="480" y="128" font-size="17" font-weight="bold" fill="#1f2328">gladys-amcrest-dahua</text>
    <text x="480" y="156" font-size="14" fill="#57606a">Docker container</text>
    <text x="480" y="176" font-size="14" fill="#57606a">HTTP Digest client</text>
    <text x="480" y="196" font-size="14" fill="#57606a">one event stream per device</text>
    <text x="480" y="216" font-size="14" fill="#57606a">ffmpeg: images ≤ 150 KB</text>
    <rect x="720" y="20" width="220" height="90" rx="14" fill="#fdf4e3" stroke="#bf8700" stroke-width="2"/>
    <text x="830" y="56" font-size="17" font-weight="bold" fill="#1f2328">Cameras</text>
    <text x="830" y="82" font-size="13" fill="#57606a">IPC, PTZ, Amcrest, Lorex…</text>
    <rect x="720" y="125" width="220" height="90" rx="14" fill="#fdf4e3" stroke="#bf8700" stroke-width="2"/>
    <text x="830" y="161" font-size="17" font-weight="bold" fill="#1f2328">Doorbells</text>
    <text x="830" y="187" font-size="13" fill="#57606a">VTO, AD110 / AD410</text>
    <rect x="720" y="230" width="220" height="90" rx="14" fill="#fdf4e3" stroke="#bf8700" stroke-width="2"/>
    <text x="830" y="266" font-size="17" font-weight="bold" fill="#1f2328">Recorders</text>
    <text x="830" y="292" font-size="13" fill="#57606a">NVR, DVR, XVR: 1 device / channel</text>
    <g stroke="#57606a" stroke-width="2.5" fill="none" marker-end="url(#a)" marker-start="url(#a)">
      <path d="M244 170 H356"/>
      <path d="M604 140 L716 70"/>
      <path d="M604 170 H716"/>
      <path d="M604 200 L716 270"/>
    </g>
    <text x="300" y="155" font-size="12" fill="#57606a">REST /api/integration/v1</text>
    <text x="300" y="193" font-size="12" fill="#57606a">+ WebSocket</text>
    <text x="660" y="318" font-size="12" fill="#57606a">local network only: /cgi-bin over HTTP(S), RTSP for the live view</text>
  </g>
  <text x="12" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#8c959f">illustration</text>
</svg>
